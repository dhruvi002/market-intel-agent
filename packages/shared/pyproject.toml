[project]
name = "mia-shared"
version = "0.1.0"
description = "Shared Pydantic schemas, prompts, and constants for the Market Intelligence Agent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia_shared"]
