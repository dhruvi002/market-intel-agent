[project]
name = "mia-agents"
version = "0.1.0"
description = "LangGraph multi-agent orchestration: Supervisor + 6 workers"
requires-python = ">=3.12"
dependencies = [
    "mia-shared",
    "mia-retrieval",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.2",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langfuse>=2.0",
    "tenacity>=9.0",
    "pydantic>=2.9",
    "sentence-transformers>=3.0",
    "tavily-python>=0.5",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[tool.uv.sources]
mia-shared = { workspace = true }
mia-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia_agents"]
