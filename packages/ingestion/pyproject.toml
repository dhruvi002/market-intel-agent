[project]
name = "mia-ingestion"
version = "0.1.0"
description = "EDGAR downloader, XBRL→Postgres ETL, PDF pipeline, MinIO storage"
requires-python = ">=3.12"
dependencies = [
    "mia-shared",
    "sec-edgar-downloader>=5.0",
    "python-edgar>=3.0",
    "docling>=2.0",
    "pymupdf>=1.24",
    "boto3>=1.35",       # MinIO via S3 API
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "tenacity>=9.0",
    "aiofiles>=24.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[tool.uv.sources]
mia-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia_ingestion"]
