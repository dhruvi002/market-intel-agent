[project]
name = "mia-eval"
version = "0.1.0"
description = "RAGAS eval harness, golden Q/A set, ablation scripts"
requires-python = ">=3.12"
dependencies = [
    "mia-shared",
    "ragas>=0.2",
    "datasets>=3.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[tool.uv.sources]
mia-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia_eval"]
