[project]
name = "mia-retrieval"
version = "0.1.0"
description = "Hybrid retrieval: BM25 + dense (bge-large) + cross-encoder reranker"
requires-python = ">=3.12"
dependencies = [
    "mia-shared",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "rank-bm25>=0.2",
    "numpy>=1.26",
    "torch>=2.4",        # for local embedding/reranker models
]

[tool.uv.sources]
mia-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia_retrieval"]
