# docker-compose.cloud.yml — Cloud-ready overlay for production deployment.
#
# This file replaces local data stores with free-tier cloud services:
#   • Qdrant Cloud   (free 1 GB cluster — no CC required)
#   • Supabase       (free Postgres — no CC required)
#   • Upstash Redis  (free serverless Redis — no CC required)
#   • MinIO omitted  (use local volume or S3-compat alternative)
#
# Usage:
#   docker compose -f infra/docker-compose.cloud.yml --env-file .env.cloud up -d
#
# Frontend deployment is handled separately via Vercel (apps/web/vercel.json).
# Backend (api + worker) can be deployed to HuggingFace Spaces using
# infra/huggingface/Dockerfile, or run on any Docker host.
#
# See docs/PHASE_9_SUMMARY.md §Cloud Deploy for the full walkthrough.

services:
  # ─── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}           # Supabase connection string
      REDIS_URL: ${REDIS_URL}                 # Upstash Redis URL
      QDRANT_URL: ${QDRANT_URL}               # Qdrant Cloud cluster URL
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}     # Qdrant Cloud API key
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_SECURE: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Worker ──────────────────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_SECURE: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    depends_on:
      api:
        condition: service_healthy
