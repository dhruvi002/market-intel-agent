[tool.uv.workspace]
members = [
    "packages/shared",
    "packages/agents",
    "packages/retrieval",
    "packages/ingestion",
    "packages/eval",
    "apps/api",
    "apps/worker",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "httpx>=0.27",       # for FastAPI test client
    "faker>=26.0",
]

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "notebooks/"]

# ─── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]
python_files = ["test_*.py", "*_test.py"]
# importlib mode isolates same-named test modules across packages (each package
# has its own tests/ dir), so the suite collects cleanly from the repo root.
addopts = "--import-mode=importlib --cov=packages --cov=apps --cov-report=term-missing --cov-report=xml"
