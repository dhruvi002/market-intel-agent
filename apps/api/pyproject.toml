[project]
name = "mia-api"
version = "0.1.0"
description = "FastAPI async gateway with WebSocket streaming"
requires-python = ">=3.12"
dependencies = [
    "mia-shared",
    "mia-agents",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.2",
    "arq>=0.26",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
]

[tool.uv.sources]
mia-shared = { workspace = true }
mia-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia_api"]
