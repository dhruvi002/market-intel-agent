[project]
name = "mia-worker"
version = "0.1.0"
description = "ARQ async task workers (ingestion, indexing, eval jobs)"
requires-python = ">=3.12"
dependencies = [
    "mia-shared",
    "mia-ingestion",
    "mia-retrieval",
    "mia-agents",
    "arq>=0.26",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "structlog>=24.4",
    "pydantic-settings>=2.5",
]

[tool.uv.sources]
mia-shared = { workspace = true }
mia-ingestion = { workspace = true }
mia-retrieval = { workspace = true }
mia-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia_worker"]
